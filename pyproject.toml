[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpmaker"
version = "0.1.0"
description = "Turn your FastAPI app into an MCP server and connect it to every AI client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "fastmcp>=3.2,<4",
  "httpx>=0.27",
  "typer>=0.12",
  "uvicorn>=0.29",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mcpmaker = "mcpmaker.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpmaker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
